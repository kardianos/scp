# Variant V2s -- V2g on the ANNEALED SUBSTRATE (S1, 2026-07-31):
# same laws, quieter geometry. The frozen jittered foam's link window
# [1.0, 1.15*(ri+rj)] is ~19% length disorder -- measured as the
# frozen-foam ceiling (gates), the foam-owned Q9 knee, and the noise
# floors drowning g2/lensing. S1 replaces the substrate MECHANISM, not
# the concepts: dart scaffold at substrate density 1.25 -> repulsion-
# to-contact anneal (apparatus keys geom_relax/geom_relax_k/geom_dtar/
# geom_lmax; serial; RNG-stream-preserving) -> contact-shell channels:
# sigma_d 19% -> 3.0%, dbar 1.545 (the m=1 rung window preserved),
# degree 7.3. The ONLY law-key value changed vs V2g is the substrate
# density key dmin (1.0 -> 1.25); every other constant is V2g verbatim.
# Anneal knobs ride as apparatus extras: geom_relax 800, k 0.3,
# contact floor 1.52, channel ceiling 1.70.
# Variant V2g — V2z + the SPACE-TRANSPORT LAW (G-battery, 2026-07-28):
# pressure pushes, nothing reaches out. Channels carry space from the
# higher-pressure end at the channel's own conductance, outflow-limited
# above es_floor (no suction: an empty cell never draws); pressure
# carries a displacement term from load (pi = Es + s_disp*(Em+Ee)) —
# matter is converted space, so a mass MAINTAINS an extended graded
# depression (the gravitational footprint, g1). s_k=0.06 (equalization
# over ~sigma in ~40 t.u.), s_disp=0.3 (core dip ~0.5 at e3a load,
# clear of the es_floor clip).
# Base below is V2z verbatim.
# Variant V2z — V2 with the choir's correction RETIRED (S2, 2026-07-28):
# kappa_freq=0, kappa_reac=0. After the flight-loads-pitch law (L4) the
# rate-level bias is not load-bearing: 17/17 passes with the constant gone
# (it was buying margin, not passes — e7 0.79->0.77, e3a 0.00071->0.00174,
# e6 gg 0.88->0.65, all still green). The mechanism itself is real and
# derived at amplitude level (v89/s2/choir_pull.c); its raw rate-level form
# (kappa_reac=1) breaks tilted transport (e3b) — see laws_V2d.cfg.
# THE LAW TABLE — one set of constants for every experiment (ROADMAP §6).
# Identical bytes in every battery run; only apparatus varies per experiment.
# Variant V2: atoms at mode boundaries, credit (integrate-and-fire, lapse at 2).
#
# Chosen at seams (§6.2 audit): w1/field_J from the optics calibration;
# w2 puts the unison rung in the nearest-neighbour link window; q_detune
# makes the fifth reachable ((1+q) >= 3/2); s_pull=0.15 avoids pair-channel
# strangulation (d* 1.47 < death 1.63; at 0.5 the death radius 1.45 sits
# inside the rung window); e_cond retired to 0 — the action atom IS the
# threshold; e_click retired — the click grain is eps(w); A0 fixed at the
# production-foam grain e_s0*dbar/C (L=30) so the atom is a constant, not
# a per-box accident.
# Law iteration L2 (battery round 2): gamma_res_m 0.02 -> 0.10 — under the
# unified pitch landscape (w2=2.9, q=1.2) per-link detunes are ~5x the old
# ones; 0.02 froze the blob rim and let voice-trickle unlock tuned pairs.
