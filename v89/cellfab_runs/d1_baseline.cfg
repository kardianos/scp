# D1 — double slit, baseline (DOUBLESLIT.md P1).
# Plane-wave slab source, wall as detuned mute at x=11.5 with two vacuum
# strip slits (sep 9, half-width 1.2), condensing screen at x=26.5,
# edge sinks. lambda = 2pi*C/w1 = 3.81; exact two-source loci printed by
# the kernel. Clicks logged as record grains complete (e_click).
# Shutter (t_expose) freezes the record after the first coherent transit —
# the reverberant pool in front of the wall otherwise re-feeds the slits
# incoherently and washes the fringes (measured: V 0.18 unshuttered vs
# 0.46 shuttered at screen D=12).
# Round 2 (repaired field sector): two-component signed amplitude with
# symmetric-normalized unitary hops (removes foam diagonal disorder — the
# unnormalized foam speckles a wave within a few cells; measured coherence
# 0.02 -> 0.76 after normalization). Linear regime (q_detune=0). lambda =
# 2pi/kx = 5.71; group velocity ~0.5 at field_J=1.8. Wider slits (2.0) and
# thin wall (1.6) keep the sub-wavelength channels above cutoff.
mode=field
init=slit
seed=20260727
L=30
T=70
dt=0.02
field_J=1.8
kx=1.1
q_detune=0
w1=1.65
prealign=1
amp=0.25
k_dep=2.0
kappa_lock=1.0
# wider diffraction cone: soft gates, weak flux-alignment (single-phase
# cells under-diffract — the majority imprint re-collimates beams; see
# DOUBLESLIT.md honest-limits note)
p_gate=2
kappa_align=0.1
e_cond=99
noise_amp=0
diag_every=250
e_click=0.15
wall_x=11.5
wall_th=1.6
slit_sep=9
slit_hw=2.0
screen_x=23.5
sink_m=1.5
src_lo=1.5
src_hi=8.5
absorb_rate=2.0
wall_detune=8
which_path=0
t_expose=55
